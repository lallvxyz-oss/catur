<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Catur</title>
<style>
:root{
  --bg:#e9efe9; --ink:#1f2a24; --muted:#5b6b62;
  --light:#f1e6c8; --dark:#6f8f72; --hint:#d9a441;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){--bg:#161c18;--ink:#eef1ec;--muted:#9fb0a5;--light:#c9bd9c;--dark:#4f6b53;}
}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Georgia,"Times New Roman",serif;
  min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:16px}
h1{margin:0;font-size:1.5rem;font-weight:700}
#status{margin:0;color:var(--muted);font-size:1rem;text-align:center;min-height:1.5em}
#board{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));grid-template-rows:repeat(8,minmax(0,1fr));width:min(92vw,440px);height:min(92vw,440px);
  border:3px solid var(--ink);border-radius:4px;overflow:hidden}
.sq{position:relative;display:flex;align-items:center;justify-content:center;cursor:pointer;min-width:0;min-height:0;overflow:hidden;user-select:none}
.sq.l{background:var(--light)} .sq.d{background:var(--dark)}
.sq.sel{outline:4px solid var(--hint);outline-offset:-4px}
.sq.hint:not(.cap)::after{content:"";width:30%;height:30%;border-radius:50%;background:var(--hint);opacity:.85}
.sq.cap{box-shadow:inset 0 0 0 4px var(--hint)}
.sq.l.chk,.sq.d.chk{background:#c8553d}
.sq.dead .pawn{transform:rotate(90deg);opacity:.85;animation:fall .7s ease-in both}
@keyframes fall{from{transform:rotate(0)}to{transform:rotate(90deg)}}
.crown{position:absolute;top:3%;right:3%;width:30%;height:30%;pointer-events:none;filter:drop-shadow(0 2px 2px rgba(0,0,0,.45));animation:pop .5s .6s ease-out both}
@keyframes pop{from{transform:scale(0) rotate(-40deg)}to{transform:scale(1) rotate(0)}}
.pawn{width:68%;height:68%;filter:drop-shadow(0 2px 2px rgba(0,0,0,.35));transition:transform .15s}
.w{--f:#fdfdfb;--e:#1f2a24}
.b{--f:#2b2f2c;--e:#f1f1ec}
.sq.sel .pawn{transform:scale(1.12)}
button{font:inherit;padding:10px 22px;border-radius:8px;border:2px solid var(--ink);background:transparent;color:var(--ink);cursor:pointer}
button:hover{background:var(--ink);color:var(--bg)}
button:focus-visible,.sq:focus-visible{outline:3px solid var(--hint);outline-offset:2px}
@media (prefers-reduced-motion:reduce){.pawn{transition:none}.sq.dead .pawn,.crown{animation:none}}
[hidden]{display:none!important}
.menu{display:flex;flex-direction:column;align-items:center;gap:14px}
.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;width:min(92vw,440px)}
.sub{margin:0;color:var(--muted)}
.big{width:min(80vw,280px);font-size:1.1rem}
.row button{padding:8px 14px;font-size:.95rem}
.row button.pal{width:40px;height:40px;padding:2px;border-radius:8px;display:flex;align-items:center;justify-content:center}
.row button.pal.on{background:var(--hint)}
.row button.pal .pawn{width:90%;height:90%}

/* ===== Lobi futuristik ===== */
#lobby{position:relative;overflow:hidden;width:min(92vw,420px);padding:34px 20px 28px;border-radius:22px;color:#e8f1ff;
  background:linear-gradient(160deg,#080c1c,#121a3a 58%,#1d1040);border:1px solid rgba(110,231,255,.38);
  box-shadow:0 0 0 1px rgba(167,139,250,.15),0 0 46px rgba(80,120,255,.3),inset 0 0 60px rgba(110,231,255,.06)}
#lobby::before{content:"";position:absolute;inset:0;pointer-events:none;
  background-image:linear-gradient(rgba(110,231,255,.09) 1px,transparent 1px),linear-gradient(90deg,rgba(110,231,255,.09) 1px,transparent 1px);
  background-size:30px 30px;animation:grid 5s linear infinite;
  -webkit-mask-image:linear-gradient(to bottom,transparent,#000 35%,#000 70%,transparent);mask-image:linear-gradient(to bottom,transparent,#000 35%,#000 70%,transparent)}
@keyframes grid{to{background-position:0 30px,30px 0}}
#lobby::after{content:"";position:absolute;left:0;right:0;height:2px;top:0;pointer-events:none;
  background:linear-gradient(90deg,transparent,#6ee7ff,transparent);opacity:.7;animation:scan 4.5s ease-in-out infinite}
@keyframes scan{0%{top:0}50%{top:100%}100%{top:0}}
.orb{position:absolute;border-radius:50%;filter:blur(38px);opacity:.5;pointer-events:none;animation:float 8s ease-in-out infinite}
.o1{width:150px;height:150px;background:#6ee7ff;top:-50px;left:-40px}
.o2{width:170px;height:170px;background:#a855f7;bottom:-60px;right:-50px;animation-delay:-4s}
.fp{position:absolute;width:84px;height:84px;pointer-events:none;opacity:.2;animation:float 7s ease-in-out infinite}
.fp .pawn{width:100%;height:100%;--f:rgba(110,231,255,.14);--e:#6ee7ff;filter:drop-shadow(0 0 6px #6ee7ff)}
.fp0{top:4%;right:4%}.fp1{bottom:5%;left:3%;animation-delay:-2s}.fp2{top:40%;left:-14px;width:64px;height:64px;animation-delay:-5s}.fp3{top:46%;right:-10px;width:70px;height:70px;animation-delay:-3s}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}
.lobby-in{position:relative;z-index:1;width:100%;display:flex;flex-direction:column;align-items:center;gap:12px;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.tag{margin:0;font:600 .72rem ui-monospace,Menlo,Consolas,monospace;letter-spacing:.2em;color:#6ee7ff}
.tag i{display:inline-block;width:8px;height:8px;border-radius:50%;background:#4ade80;box-shadow:0 0 10px #4ade80;margin-right:8px;animation:blink 1.6s infinite}
@keyframes blink{50%{opacity:.25}}
.logo{margin:4px -.35em 0 0;font-size:2.8rem;font-weight:800;letter-spacing:.35em;
  background:linear-gradient(90deg,#6ee7ff,#a78bfa,#f472b6);-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 0 14px rgba(110,231,255,.45))}
#lobby .sub{color:#9fb4d8;font-size:.9rem;letter-spacing:.12em;margin:0 0 10px;text-transform:uppercase}
.opts{display:flex;flex-direction:column;gap:12px;width:100%}
#lobby .opt{display:flex;align-items:center;gap:14px;width:100%;text-align:left;padding:14px 16px;border-radius:14px;font-family:inherit;
  color:#e8f1ff;background:rgba(255,255,255,.05);border:1px solid rgba(110,231,255,.32);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);transition:transform .2s,box-shadow .2s,background .2s}
#lobby .opt:hover,#lobby .opt:focus-visible{color:#fff;transform:translateX(4px);
  background:linear-gradient(90deg,rgba(110,231,255,.2),rgba(167,139,250,.2));box-shadow:0 0 20px rgba(110,231,255,.4),inset 0 0 12px rgba(110,231,255,.12)}
#lobby .opt:active{transform:scale(.98)}
.ic{flex:none;width:44px;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;color:#6ee7ff;
  background:rgba(110,231,255,.1);border:1px solid rgba(110,231,255,.4);box-shadow:0 0 12px rgba(110,231,255,.25)}
.ic svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tx{flex:1;display:flex;flex-direction:column;gap:2px}
.tx b{font-size:1.05rem;letter-spacing:.03em}
.tx small{color:#9fb4d8;font-size:.78rem}
.ar{font-size:1.6rem;color:#a78bfa}
@media (prefers-reduced-motion:reduce){#lobby::before,#lobby::after,.orb,.fp,.tag i{animation:none}#lobby .opt{transition:none}}
/* ===== Micro interaction ===== */
button{position:relative;overflow:hidden;transition:transform .12s,background .2s,color .2s}
button:active{transform:scale(.95)}
.rip{position:absolute;width:10px;height:10px;border-radius:50%;background:currentColor;opacity:.35;pointer-events:none;transform:translate(-50%,-50%) scale(0);animation:rip .6s ease-out forwards}
@keyframes rip{to{transform:translate(-50%,-50%) scale(30);opacity:0}}
.sq{overflow:visible}
.pawn.slide{position:relative;z-index:5;animation:slide .3s cubic-bezier(.22,1,.36,1)}
@keyframes slide{from{transform:translate(var(--dx),var(--dy)) scale(1.15)}}
.sq.land::before{content:"";position:absolute;inset:10%;border-radius:50%;border:3px solid var(--hint);pointer-events:none;animation:ping .5s ease-out both}
.sq.cap2::before{border-color:#c8553d;animation-duration:.65s}
@keyframes ping{from{transform:scale(.3);opacity:1}to{transform:scale(1.5);opacity:0}}
.sq.hint:not(.cap)::after{animation:hintin .22s ease-out both}
@keyframes hintin{from{transform:scale(0)}to{transform:scale(1)}}
.sq.cap{animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:inset 0 0 0 4px var(--hint),inset 0 0 14px 4px rgba(217,164,65,.6)}}
.sq.chk .pawn{animation:shake .45s}
@keyframes shake{20%,60%{transform:translateX(-6%)}40%,80%{transform:translateX(6%)}}
.sq.sel .pawn{filter:drop-shadow(0 0 7px var(--hint)) drop-shadow(0 3px 3px rgba(0,0,0,.4))}
@media (hover:hover){.sq:hover .pawn{transform:translateY(-3%)}.sq.sel:hover .pawn{transform:scale(1.12)}}
.enter{animation:enter .45s cubic-bezier(.2,.8,.2,1) both}
@keyframes enter{from{opacity:0;transform:scale(.94) translateY(12px);filter:blur(5px)}}
@media (prefers-reduced-motion:reduce){.pawn.slide,.sq.land::before,.sq.cap,.sq.chk .pawn,.sq.hint::after,.enter,.rip{animation:none!important}}
/* ===== Perbaikan respons & rasa sentuh ===== */
.sq,button{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.pawn{filter:none;transition:none}
.sq.cap{animation:none}
.sq.sel{box-shadow:inset 0 0 14px 2px rgba(217,164,65,.55)}
.sq.sel .pawn{filter:none;transform:scale(1.14) translateY(-4%);animation:lift .26s cubic-bezier(.34,1.56,.64,1) both}
@keyframes lift{from{transform:scale(.92)}to{transform:scale(1.14) translateY(-4%)}}
.pawn.slide{animation-duration:.22s}
button{transition:transform .28s cubic-bezier(.34,1.56,.64,1),background .2s,color .2s}
button:active{transform:scale(.93);transition-duration:.07s,.2s,.2s}
#lobby .opt{transition:transform .28s cubic-bezier(.34,1.56,.64,1),box-shadow .2s,background .2s}
#lobby .opt:active{transform:scale(.95);transition-duration:.07s,.2s,.2s}
@media (prefers-reduced-motion:reduce){.sq.sel .pawn{animation:none}}
/* ===== Layar loading ===== */
#loading{position:relative;overflow:hidden;width:min(92vw,420px);padding:34px 20px 30px;border-radius:22px;color:#e8f1ff;
  background:linear-gradient(160deg,#080c1c,#121a3a 58%,#1d1040);border:1px solid rgba(110,231,255,.38);
  box-shadow:0 0 46px rgba(80,120,255,.3),inset 0 0 60px rgba(110,231,255,.06)}
#loading::before{content:"";position:absolute;inset:0;pointer-events:none;
  background-image:linear-gradient(rgba(110,231,255,.09) 1px,transparent 1px),linear-gradient(90deg,rgba(110,231,255,.09) 1px,transparent 1px);
  background-size:30px 30px;animation:grid 5s linear infinite}
.lb{display:grid;grid-template-columns:repeat(4,1fr);grid-template-rows:repeat(4,1fr);width:min(62vw,230px);aspect-ratio:1;position:relative;margin:8px 0;
  border:2px solid rgba(110,231,255,.55);border-radius:12px;overflow:hidden;box-shadow:0 0 26px rgba(110,231,255,.35)}
.lb .l{background:rgba(110,231,255,.16)} .lb .d{background:rgba(167,139,250,.3)}
.ldk{position:absolute;left:0;top:0;width:25%;height:25%;display:flex;align-items:center;justify-content:center;
  animation:knightpath 3.2s cubic-bezier(.6,0,.3,1) infinite}
.ldk .pawn{--f:#6ee7ff;--e:#fff;width:74%;height:74%;filter:drop-shadow(0 0 7px #6ee7ff);animation:hop .8s ease-in-out infinite}
@keyframes knightpath{0%,100%{transform:translate(0,300%)}25%{transform:translate(100%,100%)}50%{transform:translate(300%,0)}75%{transform:translate(200%,200%)}}
@keyframes hop{0%,100%{transform:translateY(0) scale(1)}50%{transform:translateY(-30%) scale(1.25)}}
.lt{margin:2px 0 4px;color:#9fb4d8;font-size:.9rem;letter-spacing:.08em;min-height:1.3em;text-align:center}
.bar{width:100%;height:8px;border-radius:99px;background:rgba(255,255,255,.08);overflow:hidden;border:1px solid rgba(110,231,255,.3)}
.bar i{display:block;height:100%;width:0;border-radius:99px;background:linear-gradient(90deg,#6ee7ff,#a78bfa,#f472b6);box-shadow:0 0 12px rgba(110,231,255,.7)}
@media (prefers-reduced-motion:reduce){.ldk,.ldk .pawn,#loading::before{animation:none}}
/* ===== Animasi mulus (hanya transform & opacity) ===== */
.bar i{width:100%;transform:scaleX(0);transform-origin:0 50%;will-change:transform}
@keyframes fill{to{transform:scaleX(1)}}
#loading::before{animation:none}
.lb{contain:paint}
.ldk{will-change:transform;animation-timing-function:cubic-bezier(.45,.05,.35,1)}
.ldk::before{content:"";position:absolute;inset:6%;border-radius:50%;background:radial-gradient(circle,rgba(110,231,255,.55),transparent 70%)}
.ldk .pawn{filter:none;will-change:transform;position:relative}
@keyframes enter{from{opacity:0;transform:translateY(12px) scale(.96)}}
#lobby::after{top:0;height:100%;opacity:1;background:linear-gradient(to bottom,transparent calc(50% - 1px),rgba(110,231,255,.7) 50%,transparent calc(50% + 1px));will-change:transform}
@keyframes scan{0%,100%{transform:translateY(-50%)}50%{transform:translateY(50%)}}
/* ===== Layar penuh ===== */
html,body{height:100%;background:#080c1c}
body{padding:0;min-height:100%}
#lobby,#loading,#game{position:fixed;inset:0;z-index:10;width:auto;border-radius:0;border:none;box-shadow:none;margin:0;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  background:linear-gradient(160deg,#080c1c,#121a3a 58%,#1d1040);
  padding:max(24px,env(safe-area-inset-top)) 20px max(24px,env(safe-area-inset-bottom))}
.lobby-in{max-width:460px;gap:16px}
.logo{font-size:clamp(3rem,15vw,5.2rem)}
.tag{font-size:.8rem}
#lobby .sub{font-size:1rem;margin-bottom:18px}
.opts{gap:14px}
#lobby .opt{padding:18px 20px;border-radius:16px}
.ic{width:52px;height:52px;border-radius:14px}
.ic svg{width:28px;height:28px}
.tx b{font-size:1.15rem}
.tx small{font-size:.85rem}
.o1{width:340px;height:340px;top:-120px;left:-100px}
.o2{width:380px;height:380px;bottom:-140px;right:-120px}
.fp{width:clamp(90px,18vw,170px);height:clamp(90px,18vw,170px)}
.fp0{top:6%;right:6%}.fp1{bottom:7%;left:5%}
.fp2,.fp3{width:clamp(70px,13vw,120px);height:clamp(70px,13vw,120px)}
.fp2{top:36%;left:4%}.fp3{top:50%;right:4%}
.lb{width:min(70vw,300px)}
#game{overflow:auto;gap:12px;--ink:#e8f1ff;--muted:#9fb4d8;--bg:#0b1020}
#game::before{content:"";position:fixed;inset:0;pointer-events:none;
  background-image:linear-gradient(rgba(110,231,255,.06) 1px,transparent 1px),linear-gradient(90deg,rgba(110,231,255,.06) 1px,transparent 1px);background-size:30px 30px}
#game>*{position:relative;z-index:1}
#game h1{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-weight:800;letter-spacing:.3em;margin-right:-.3em;
  background:linear-gradient(90deg,#6ee7ff,#a78bfa,#f472b6);-webkit-background-clip:text;background-clip:text;color:transparent}
#board{width:clamp(260px,min(96vw,100vh - 280px),720px);height:clamp(260px,min(96vw,100vh - 280px),720px);
  width:clamp(260px,min(96vw,100dvh - 280px),720px);height:clamp(260px,min(96vw,100dvh - 280px),720px);
  border-color:rgba(110,231,255,.6);border-radius:10px;box-shadow:0 0 34px rgba(110,231,255,.25)}
.row{width:min(96vw,560px)}
/* ===== Tema warna papan ===== */
#lobby{justify-content:flex-start;overflow-x:hidden;overflow-y:auto}
.lobby-in{margin:auto 0}
#lobby.tm .logo{font-size:2.2rem}
.tgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:100%}
#lobby .th{padding:10px 12px;gap:10px;border-radius:14px}
#lobby .th.on{border-color:#6ee7ff;background:linear-gradient(90deg,rgba(110,231,255,.22),rgba(167,139,250,.22));box-shadow:0 0 16px rgba(110,231,255,.45)}
.th .tx b{font-size:.95rem}
.sw{flex:none;width:34px;height:34px;border-radius:8px;overflow:hidden;display:grid;grid-template-columns:1fr 1fr;border:1px solid rgba(255,255,255,.3)}
.sw i{display:block}
.pv{display:grid;grid-template-columns:repeat(8,1fr);width:100%;border-radius:10px;overflow:hidden;border:1px solid rgba(110,231,255,.5);box-shadow:0 0 20px rgba(110,231,255,.2)}
.pv div{aspect-ratio:1;display:flex;align-items:center;justify-content:center;transition:background .25s}
.pv .l{background:var(--light)}.pv .d{background:var(--dark)}
.pv .pawn{width:78%;height:78%}
/* ===== Model bidak & tata letak ringkas ===== */
[data-ps="gold"] .w{--f:#e6e8ee;--e:#586070}[data-ps="gold"] .b{--f:#c8962a;--e:#4a3000}
[data-ps="wood"] .w{--f:#f6dfb4;--e:#6b4423}[data-ps="wood"] .b{--f:#5a3a1e;--e:#f0d3a0}
[data-ps="neon"] .w{--f:rgba(110,231,255,.3);--e:#0097b8}[data-ps="neon"] .b{--f:rgba(244,114,182,.3);--e:#d6247f}
.sec{margin:6px 0 -4px;width:100%;text-align:left;color:#9fb4d8;font-size:.78rem;letter-spacing:.16em;text-transform:uppercase}
.tgrid{grid-template-columns:repeat(4,1fr);gap:8px}
#lobby .th{flex-direction:column;padding:8px 4px;gap:6px;text-align:center;border-radius:12px}
.sw{width:100%;height:auto;aspect-ratio:1}
.th .tx{align-items:center;flex:none}
.th .tx b{font-size:.7rem;font-weight:600;line-height:1.1}
.pgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;width:100%}
.pci[data-ps=""] .w{--f:#fdfdfb;--e:#1f2a24}.pci[data-ps=""] .b{--f:#2b2f2c;--e:#f1f1ec}
.pci[data-ps="gold"] .w{--f:#e6e8ee;--e:#586070}.pci[data-ps="gold"] .b{--f:#c8962a;--e:#4a3000}
.pci[data-ps="wood"] .w{--f:#f6dfb4;--e:#6b4423}.pci[data-ps="wood"] .b{--f:#5a3a1e;--e:#f0d3a0}
.pci[data-ps="neon"] .w{--f:rgba(110,231,255,.3);--e:#0097b8}.pci[data-ps="neon"] .b{--f:rgba(244,114,182,.3);--e:#d6247f}
.pci{display:flex;height:34px}
.pci .pawn{width:34px;height:34px}
</style>
</head>
<body>
<section id="lobby" class="menu">
<div aria-hidden="true"><span class="orb o1"></span><span class="orb o2"></span><div id="fl"></div></div>
<div class="lobby-in">
<p class="tag"><i></i>SISTEM SIAP</p>
<h1 class="logo">CATUR</h1>
<p class="sub" id="lobbysub">Strategi · Logika · Masa depan</p>
<div class="opts" id="mainopts">
<button class="opt" data-m="pvp"><span class="ic"><svg viewBox="0 0 24 24"><circle cx="8" cy="8" r="3"/><circle cx="16" cy="8" r="3"/><path d="M2 20c0-4 3-6 6-6s6 2 6 6M10 20c0-4 3-6 6-6s6 2 6 6"/></svg></span><span class="tx"><b>Bermain berdua</b><small>Dua pemain, satu layar</small></span><span class="ar">›</span></button>
<button class="opt" data-m="ai"><span class="ic"><svg viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="2"/><path d="M9 2v4M15 2v4M9 18v4M15 18v4M2 9h4M2 15h4M18 9h4M18 15h4"/></svg></span><span class="tx"><b>Vs komputer</b><small>Tantang kecerdasan buatan</small></span><span class="ar">›</span></button>
<button class="opt" data-m="theme"><span class="ic"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18M3 15h18M9 3v18M15 3v18"/></svg></span><span class="tx"><b>Tampilan papan</b><small>Warna papan dan model bidak</small></span><span class="ar">›</span></button>
</div>
<div class="opts" id="lvlopts" hidden>

<script>
const files="abcdefgh";
const boardEl=document.getElementById("board");
const statusEl=document.getElementById("status");
const NAMES={pawn:"pion",rook:"benteng",knight:"kuda",bishop:"gajah",queen:"menteri",king:"raja"};
const SIDE={w:"Putih",b:"Hitam"};
let pieces, selected, turn, winner, mode=null, lastMove=null, aiLevel=1, dl=0;
const LVN=["Mudah","Sedang","Sulit"];
const LV=[{d:0,n:220,t:0},{d:1,n:12,t:0},{d:2,n:3,t:2000}];

const st='fill="var(--f)" stroke="var(--e)" stroke-width="2" stroke-linejoin="round"';
const base='<rect x="8" y="30" width="24" height="5" rx="2" '+st+'/>';
const svg=(n,body)=>`<svg class="pawn" viewBox="0 0 40 40" aria-label="${n}">${body}</svg>`;
const SVG={
  pawn:svg("Pion",`<circle cx="20" cy="11" r="6" ${st}/><path d="M14 20h12l3 10H11z" ${st}/>${base}`),
  rook:svg("Benteng",`<path d="M11 6h4v4h3V6h4v4h3V6h4v9l-4 3v10h4v6H11v-6h4V18l-4-3z" ${st}/>`),
  knight:svg("Kuda",`<path d="M11 34c0-9 3-13 7-16-3 0-5 1-7 4l-3-3 7-10c4-4 10-3 13 1 4 5 5 14 5 24z" ${st}/><circle cx="21" cy="12" r="1.5" fill="var(--e)"/>`),
  bishop:svg("Gajah",`<circle cx="20" cy="6" r="3" ${st}/><path d="M20 10c7 4 9 10 5 18H15c-4-8-2-14 5-18z" ${st}/><path d="M17 17h6M20 14v6" stroke="var(--e)" stroke-width="2" stroke-linecap="round"/>${base}`),
  queen:svg("Menteri",`<path d="M8 12l5 12 7-14 7 14 5-12-3 20H11z" ${st}/><circle cx="8" cy="10" r="2.2" ${st}/><circle cx="20" cy="7" r="2.2" ${st}/><circle cx="32" cy="10" r="2.2" ${st}/>`),
  king:svg("Raja",`<path d="M20 2v8M16 6h8" stroke="var(--e)" stroke-width="2.5" stroke-linecap="round"/><path d="M12 14h16l3 16H9z" ${st}/>${base}`)
};
const CROWN='<svg class="crown" viewBox="0 0 40 40" aria-label="Mahkota"><path d="M5 31l-2-19 10 8 7-13 7 13 10-8-2 19z" fill="#f2b705" stroke="#8a5a00" stroke-width="2" stroke-linejoin="round"/><circle cx="3" cy="11" r="2.2" fill="#f7d34a" stroke="#8a5a00"/><circle cx="20" cy="6" r="2.2" fill="#f7d34a" stroke="#8a5a00"/><circle cx="37" cy="11" r="2.2" fill="#f7d34a" stroke="#8a5a00"/></svg>';

function reset(){
  pieces={};
  const back=["rook","knight","bishop","queen","king","bishop","knight","rook"];
  back.forEach((t,c)=>{
    pieces["wb"+c]={t,s:"w",r:7,c};
    pieces["bb"+c]={t,s:"b",r:0,c};
  });
  for(let c=0;c<8;c++){
    pieces["wp"+c]={t:"pawn",s:"w",r:6,c};
    pieces["bp"+c]={t:"pawn",s:"b",r:1,c};
  }
  selected=null; turn="w"; winner=null; lastMove=null;
  render();
}
const at=(r,c)=>Object.keys(pieces).find(k=>pieces[k].r===r&&pieces[k].c===c);
const inb=(r,c)=>r>=0&&r<8&&c>=0&&c<8;
const free=(r,c)=>inb(r,c)&&!at(r,c);

const ORTH=[[1,0],[-1,0],[0,1],[0,-1]], DIAG=[[1,1],[1,-1],[-1,1],[-1,-1]];
function pseudo(id,attack){
  const {t:type,s,r,c}=pieces[id], t=[];
  const add=(y,x)=>{
    if(!inb(y,x)) return false;
    const k=at(y,x);
    if(!k){ t.push({r:y,c:x}); return true; }
    if(pieces[k].s!==s) t.push({r:y,c:x});
    return false;
  };
  const slide=dirs=>{
    for(const [dr,dc] of dirs){ let y=r+dr,x=c+dc; while(add(y,x)){ y+=dr; x+=dc; } }
  };
  if(type==="pawn"){
    const d=s==="w"?-1:1, start=s==="w"?6:1;
    if(attack){
      for(const dc of [-1,1]) if(inb(r+d,c+dc)) t.push({r:r+d,c:c+dc});
    } else {
      if(free(r+d,c)){
        t.push({r:r+d,c});
        if(r===start&&free(r+2*d,c)) t.push({r:r+2*d,c});
      }
      for(const dc of [-1,1]){
        const k=inb(r+d,c+dc)&&at(r+d,c+dc);
        if(k&&pieces[k].s!==s) t.push({r:r+d,c:c+dc});
      }
    }
  } else if(type==="rook") slide(ORTH);
  else if(type==="bishop") slide(DIAG);
  else if(type==="queen") slide(ORTH.concat(DIAG));
  else if(type==="knight"){
    for(const [dr,dc] of [[2,1],[2,-1],[-2,1],[-2,-1],[1,2],[1,-2],[-1,2],[-1,-2]]) add(r+dr,c+dc);
  } else if(type==="king"){
    for(const [dr,dc] of ORTH.concat(DIAG)) add(r+dr,c+dc);
    const home=s==="w"?7:0;
    if(!attack && !pieces[id].moved && r===home && c===4){
      const canRook=col=>{ const k=at(home,col); return k && pieces[k].t==="rook" && pieces[k].s===s && !pieces[k].moved; };
      if(canRook(7)&&free(home,5)&&free(home,6)) t.push({r:home,c:6});
      if(canRook(0)&&free(home,1)&&free(home,2)&&free(home,3)) t.push({r:home,c:2});
    }
  }
  return t;
}

function inCheck(s){
  const k=Object.keys(pieces).find(i=>pieces[i].t==="king"&&pieces[i].s===s);
  if(!k) return false;
  const {r,c}=pieces[k];
  return Object.keys(pieces).some(i=>pieces[i].s!==s&&pseudo(i,true).some(m=>m.r===r&&m.c===c));
}

function safe(id,r,c){
  const p=pieces[id], r0=p.r, c0=p.c, v=at(r,c), vp=v&&pieces[v];
  if(v) delete pieces[v];
  p.r=r; p.c=c;
  const ok=!inCheck(p.s);
  p.r=r0; p.c=c0;
  if(v) pieces[v]=vp;
  return ok;
}

function targets(id){
  if(!id) return [];
  const p=pieces[id], c0=p.c;
  return pseudo(id).filter(m=>{
    if(p.t==="king"&&Math.abs(m.c-c0)===2){
      if(inCheck(p.s)||!safe(id,m.r,c0+(m.c>c0?1:-1))) return false;
    }
    return safe(id,m.r,m.c);
  });
}

const hasMoves=s=>Object.keys(pieces).some(i=>pieces[i].s===s&&targets(i).length>0);

function render(){
  boardEl.innerHTML="";
  const t=targets(selected), chk=mode!=="edit"&&inCheck(turn);
  for(let r=0;r<8;r++){
    for(let c=0;c<8;c++){
      const s=document.createElement("div");
      s.className="sq "+((r+c)%2===0?"l":"d");
      s.tabIndex=0;
      s.setAttribute("role","gridcell");
      s.setAttribute("aria-label",files[c]+(8-r));
      const k=at(r,c);
      if(k){
        s.innerHTML=SVG[pieces[k].t].replace('class="pawn"','class="pawn '+pieces[k].s+((lastMove&&lastMove.r===r&&lastMove.c===c)?' slide':'')+'"');
        if(lastMove&&lastMove.r===r&&lastMove.c===c){
          s.style.setProperty("--dx",((lastMove.fc-c)*147)+"%"); s.style.setProperty("--dy",((lastMove.fr-r)*147)+"%");
          s.classList.add("land"); if(lastMove.cap) s.classList.add("cap2");
        }
        if(k===selected) s.classList.add("sel");
        if(chk&&pieces[k].t==="king"&&pieces[k].s===turn) s.classList.add("chk");
        if(winner&&winner!=="draw"&&pieces[k].t==="king"){
          if(pieces[k].s!==winner) s.classList.add("dead");
          else s.insertAdjacentHTML("beforeend",CROWN);
        }
      }
      if(t.some(x=>x.r===r&&x.c===c)){ s.classList.add("hint"); if(k) s.classList.add("cap"); }
      const act=()=>mode==="edit"?edit(r,c):click(r,c);
      s.onpointerdown=e=>{ e.preventDefault(); act(); };
      s.onkeydown=e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();act();}};
      boardEl.appendChild(s);
    }
  }
  lastMove=null;
  if(mode==="edit"){statusEl.textContent="Edit papan: pilih bidak, lalu ketuk kotak. Ketuk bidak yang sama untuk menghapus.";return;}
  const pre=chk?"SKAK! ":"";
  if(winner==="draw") statusEl.textContent="Remis (pat): "+SIDE[turn]+" tidak punya langkah sah.";
  else if(winner) statusEl.textContent="Skakmat! "+SIDE[winner]+" menang. Raja "+(winner==="w"?"hitam":"putih")+" tumbang.";
  else if(selected) statusEl.textContent=pre+(t.length
    ? "Pilih kotak bertitik untuk menggerakkan "+NAMES[pieces[selected].t]+"."
    : "Bidak ini belum bisa bergerak. Pilih bidak lain.");
  else statusEl.textContent=pre+(mode==="ai"&&turn==="b"?"Komputer sedang berpikir…":"Giliran "+SIDE[turn]+(mode==="ai"?" (kamu) · Lawan "+LVN[aiLevel]:"")+". Ketuk bidak untuk memilihnya.");
}

function doMove(id,r,c){
  const p=pieces[id], o={r:p.r,c:p.c,t:p.t,m:p.moved}, v=at(r,c), vp=v&&pieces[v], dc=c-p.c;
  let rk,ro;
  if(v) delete pieces[v];
  if(p.t==="king"&&Math.abs(dc)===2){
    rk=at(r,dc>0?7:0);
    if(rk){ ro={c:pieces[rk].c,m:pieces[rk].moved}; pieces[rk].c=dc>0?5:3; pieces[rk].moved=true; }
  }
  p.r=r; p.c=c; p.moved=true;
  if(p.t==="pawn"&&(r===0||r===7)) p.t="queen";
  return ()=>{ Object.assign(p,{r:o.r,c:o.c,t:o.t,moved:o.m}); if(v) pieces[v]=vp; if(rk){ pieces[rk].c=ro.c; pieces[rk].moved=ro.m; } };
}

function move(r,c){
  const p=pieces[selected], cap=!!at(r,c);
  lastMove={fr:p.r,fc:p.c,r,c,cap};
  doMove(selected,r,c);
  selected=null;
  turn=turn==="w"?"b":"w";
  if(!hasMoves(turn)) winner=inCheck(turn)?(turn==="w"?"b":"w"):"draw";
  render();
  hap(winner?[40,60,40]:inCheck(turn)?[30,50,30]:cap?20:12);
  if(mode==="ai"&&turn==="b"&&!winner) setTimeout(aiMove,200);
}

/* ===== Komputer (minimax 2 langkah) ===== */
const VAL={pawn:100,knight:320,bishop:330,rook:500,queen:900,king:0};
function ev(){
  let s=0;
  for(const k in pieces){
    const p=pieces[k];
    let v=VAL[p.t];
    if(p.t!=="rook"&&p.t!=="queen"&&p.t!=="king") v+=(7-Math.abs(p.r-3.5)-Math.abs(p.c-3.5))*3;
    s+=p.s==="b"?v:-v;
  }
  return s;
}
function movesOf(s){
  const ms=[];
  for(const id of Object.keys(pieces)) if(pieces[id].s===s) for(const m of targets(id)) ms.push({id,r:m.r,c:m.c});
  const cv=m=>{ const v=at(m.r,m.c); return v?VAL[pieces[v].t]:0; };
  return ms.sort((a,b)=>cv(b)-cv(a));
}
function search(d,s,a,b){
  if(d===0||(dl&&performance.now()>dl)) return ev();
  const ms=movesOf(s);
  if(!ms.length) return inCheck(s)?(s==="b"?-1e5:1e5):0;
  let best=s==="b"?-1e9:1e9;
  for(const m of ms){
    const u=doMove(m.id,m.r,m.c), v=search(d-1,s==="b"?"w":"b",a,b);
    u();
    if(s==="b"){ best=Math.max(best,v); a=Math.max(a,v); } else { best=Math.min(best,v); b=Math.min(b,v); }
    if(b<=a) break;
  }
  return best;
}
function aiMove(){
  if(winner||mode!=="ai"||turn!=="b") return;
  let best=null, bs=-1e9;
  const cfg=LV[aiLevel];
  dl=cfg.t?performance.now()+cfg.t:0;
  for(const m of movesOf("b")){
    if(dl&&performance.now()>dl&&best) break;
    const u=doMove(m.id,m.r,m.c), v=search(cfg.d,"w",-1e9,1e9)+Math.random()*cfg.n;
    u();
    if(dl&&performance.now()>dl&&best) break;
    if(v>bs){ bs=v; best=m; }
  }
  dl=0;
  if(best){ selected=best.id; move(best.r,best.c); }
}

function click(r,c){
  if(winner||(mode==="ai"&&turn==="b")) return;
  if(selected && targets(selected).some(x=>x.r===r&&x.c===c)){ move(r,c); return; }
  const k=at(r,c);
  if(k && pieces[k].s===turn){ selected=(selected===k)?null:k; hap(8); }
  else selected=null;
  render();
}

/* ===== Lobi & editor papan ===== */
const $=id=>document.getElementById(id);
function hap(){}
document.addEventListener("pointerdown",e=>{
  const b=e.target.closest&&e.target.closest("button");
  if(!b) return;
  const r=b.getBoundingClientRect(), s=document.createElement("span");
  s.className="rip"; s.style.left=(e.clientX-r.left)+"px"; s.style.top=(e.clientY-r.top)+"px";
  b.appendChild(s); setTimeout(()=>s.remove(),650);
});
let brush={t:"pawn",s:"w"}, edTurn="w", uid=0;

function show(m){
  mode=m;
  const sec=$(m===null?"lobby":"game");
  setTimeout(()=>{ sec.classList.remove("enter"); void sec.offsetWidth; sec.classList.add("enter"); },0);
  $("loading").hidden=true;
  $("lobby").hidden=m!==null;
  $("game").hidden=m===null;
  $("palette").hidden=$("edctl").hidden=m!=="edit";
  $("gamectl").hidden=m==="edit";
}

function buildPal(){
  const el=$("palette"); el.innerHTML="";
  for(const s of ["w","b"]) for(const t of Object.keys(SVG)){
    const b=document.createElement("button");
    b.className="pal"+(brush&&brush.t===t&&brush.s===s?" on":"");
    b.setAttribute("aria-label",NAMES[t]+" "+SIDE[s].toLowerCase());
    b.innerHTML=SVG[t].replace('class="pawn"','class="pawn '+s+'"');
    b.onclick=()=>{ brush={t,s}; buildPal(); };
    el.appendChild(b);
  }
  const e=document.createElement("button");
  e.className="pal"+(brush?"":" on");
  e.textContent="🗑"; e.setAttribute("aria-label","Hapus");
  e.onclick=()=>{ brush=null; buildPal(); };
  el.appendChild(e);
}

function edit(r,c){
  const k=at(r,c);
  if(brush&&brush.t==="pawn"&&(r===0||r===7)) return;
  const same=k&&brush&&pieces[k].t===brush.t&&pieces[k].s===brush.s;
  if(k) delete pieces[k];
  if(brush&&!same){
    if(brush.t==="king") for(const i of Object.keys(pieces)) if(pieces[i].t==="king"&&pieces[i].s===brush.s) delete pieces[i];
    pieces["e"+(++uid)]={t:brush.t,s:brush.s,r,c};
  }
  render();
}

function startFromEdit(m){
  const n=s=>Object.values(pieces).filter(p=>p.t==="king"&&p.s===s).length;
  if(n("w")!==1||n("b")!==1){ statusEl.textContent="Setiap sisi harus punya tepat satu raja."; return; }
  show(m); selected=null; turn=edTurn; winner=null; lastMove=null;
  if(!hasMoves(turn)) winner=inCheck(turn)?(turn==="w"?"b":"w"):"draw";
  render();
  if(m==="ai"&&turn==="b"&&!winner) setTimeout(aiMove,400);
}

function enter(m){
  show(m); reset();
  if(m==="edit"){ brush={t:"pawn",s:"w"}; edTurn="w"; $("edturn").textContent="Giliran: Putih"; buildPal(); }
}

for(let i=0;i<16;i++){
  const d=document.createElement("div");
  d.className=((i>>2)+(i&3))%2?"d":"l";
  $("lb").appendChild(d);
}
{
  const k=document.createElement("div");
  k.className="ldk"; k.innerHTML=SVG.knight;
  $("lb").appendChild(k);
}

let loadingNow=false;
function runLoad(msgs,D,done){
  if(loadingNow) return;
  loadingNow=true;
  $("lobby").hidden=true; $("game").hidden=true;
  const L=$("loading"); L.hidden=false; L.classList.remove("enter"); void L.offsetWidth; L.classList.add("enter");
  const bar=$("lbar"); bar.style.animation="none"; void bar.offsetWidth; bar.style.animation="fill "+D+"ms linear forwards";
  const t0=performance.now(); let lp=-1, lm=-1;
  (function tick(now){
    const p=Math.min(1,(now-t0)/D), pc=Math.floor(p*100), mi=Math.min(msgs.length-1,Math.floor(p*msgs.length));
    if(pc!==lp){ lp=pc; $("lpct").textContent=pc+"%"; }
    if(mi!==lm){ lm=mi; $("ltxt").textContent=msgs[mi]; }
    if(p<1) requestAnimationFrame(tick); else { loadingNow=false; done(); }
  })(t0);
}
function load(m){
  runLoad(["Menyusun papan…","Memanggil bidak…",m==="ai"?"Mengaktifkan lawan komputer…":m==="theme"?"Memuat tampilan…":"Menyiapkan dua pemain…","Hampir siap…"],5000,()=>{ if(m==="ai") chooseLevel(); else if(m==="theme") chooseTheme(); else enter(m); });
}
function backLoad(){
  mode=null;
  runLoad(["Menyimpan papan…","Menutup permainan…","Kembali ke lobi…"],2500,()=>{ resetLobby(); show(null); });
}

document.querySelectorAll("#lobby [data-m]").forEach(b=>b.onclick=()=>load(b.dataset.m));

function resetLobby(){
  $("themeopts").hidden=true; $("lobby").classList.remove("tm");
  $("mainopts").hidden=false; $("lvlopts").hidden=true;
  $("lobbysub").textContent="Strategi · Logika · Masa depan";
}
function chooseLevel(){
  $("loading").hidden=true;
  const L=$("lobby"); L.hidden=false;
  $("mainopts").hidden=true; $("lvlopts").hidden=false;
  $("lobbysub").textContent="Pilih tingkat kesulitan";
  L.classList.remove("enter"); void L.offsetWidth; L.classList.add("enter");
}
document.querySelectorAll("#lvlopts [data-lv]").forEach(b=>b.onclick=()=>{ aiLevel=+b.dataset.lv; resetLobby(); enter("ai"); });
$("lvlback").onclick=resetLobby;

const THEMES=[
  {n:"Hijau Klasik",l:"#f1e6c8",d:"#6f8f72"},
  {n:"Hitam Putih",l:"#ededed",d:"#3f3f3f"},
  {n:"Hijau Putih",l:"#f4f8f2",d:"#5f9a68"},
  {n:"Biru Putih",l:"#eef4fb",d:"#5b8bc9"},
  {n:"Cokelat Kayu",l:"#f0d9b5",d:"#b58863"},
  {n:"Ungu Putih",l:"#f4effb",d:"#8a6bc4"},
  {n:"Merah Putih",l:"#fbf0f0",d:"#c0575f"},
  {n:"Neon Malam",l:"#2d4373",d:"#121c3a"}
];
let themeIdx=0;
function markTheme(){ document.querySelectorAll("#tgrid .th").forEach((b,i)=>b.classList.toggle("on",i===themeIdx)); }
function applyTheme(i){
  const t=THEMES[i], s=document.documentElement.style;
  s.setProperty("--light",t.l); s.setProperty("--dark",t.d);
  themeIdx=i; markTheme();
  try{ localStorage.setItem("catur-theme",i); }catch(e){}
}
function chooseTheme(){
  $("loading").hidden=true;
  const L=$("lobby"); L.hidden=false; L.classList.add("tm");
  $("mainopts").hidden=true; $("lvlopts").hidden=true; $("themeopts").hidden=false;
  $("lobbysub").textContent="Atur tampilan papan";
  L.classList.remove("enter"); void L.offsetWidth; L.classList.add("enter");
}
(()=>{
  const pv=$("pv"), back=["rook","knight","bishop","queen","king","bishop","knight","rook"];
  for(let r=0;r<2;r++) for(let c=0;c<8;c++){
    const d=document.createElement("div");
    d.className=(r+c)%2===0?"l":"d";
    d.innerHTML=SVG[back[c]].replace('class="pawn"','class="pawn '+(r?"w":"b")+'"');
    pv.appendChild(d);
  }
  const g=$("tgrid");
  THEMES.forEach((t,i)=>{
    const b=document.createElement("button");
    b.className="opt th";
    b.innerHTML='<span class="sw"><i style="background:'+t.l+'"></i><i style="background:'+t.d+'"></i><i style="background:'+t.d+'"></i><i style="background:'+t.l+'"></i></span><span class="tx"><b>'+t.n+'</b></span>';
    b.onclick=()=>applyTheme(i);
    g.appendChild(b);
  });
  let v=0;
  try{ const s=localStorage.getItem("catur-theme"); if(s!==null&&THEMES[+s]) v=+s; }catch(e){}
  applyTheme(v);
  $("thdone").onclick=resetLobby;
})();

const SVG0={...SVG};
const PIECES=[
  {n:"Klasik",skin:""},
  {n:"Emas Perak",skin:"gold"},
  {n:"Kayu",skin:"wood"},
  {n:"Neon",skin:"neon"}
];
let pieceIdx=0;
function buildPv(){
  const pv=$("pv"), back=["rook","knight","bishop","queen","king","bishop","knight","rook"];
  pv.innerHTML="";
  for(let r=0;r<2;r++) for(let c=0;c<8;c++){
    const d=document.createElement("div");
    d.className=(r+c)%2===0?"l":"d";
    d.innerHTML=SVG[back[c]].replace('class="pawn"','class="pawn '+(r?"w":"b")+'"');
    pv.appendChild(d);
  }
}
function markPiece(){ document.querySelectorAll("#pgrid .th").forEach((b,i)=>b.classList.toggle("on",i===pieceIdx)); }
function applyPiece(i){
  const p=PIECES[i], R=document.documentElement;
  Object.assign(SVG,SVG0);
  if(p.skin) R.dataset.ps=p.skin; else delete R.dataset.ps;
  pieceIdx=i; markPiece(); buildPv();
  if(mode&&pieces) render();
  try{ localStorage.setItem("catur-piece2",i); }catch(e){}
}
(()=>{
  const g=$("pgrid");
  PIECES.forEach((p,i)=>{
    const b=document.createElement("button"), set=SVG0;
    b.className="opt th";
    b.innerHTML='<span class="pci" data-ps="'+p.skin+'">'+set.knight.replace('class="pawn"','class="pawn w"')+set.knight.replace('class="pawn"','class="pawn b"')+'</span><span class="tx"><b>'+p.n+'</b></span>';
    b.onclick=()=>applyPiece(i);
    g.appendChild(b);
  });
  let v=0;
  try{ const s=localStorage.getItem("catur-piece2"); if(s!==null&&PIECES[+s]) v=+s; }catch(e){}
  applyPiece(v);
})();
["king","knight","queen","rook"].forEach((t,i)=>{
  const d=document.createElement("div");
  d.className="fp fp"+i; d.innerHTML=SVG[t];
  $("fl").appendChild(d);
});
$("tolobby").onclick=backLoad;
$("reset").onclick=reset;
$("edclear").onclick=()=>{ pieces={}; render(); };
$("edstart").onclick=reset;
$("edturn").onclick=()=>{ edTurn=edTurn==="w"?"b":"w"; $("edturn").textContent="Giliran: "+SIDE[edTurn]; };
$("edpvp").onclick=()=>startFromEdit("pvp");
$("edai").onclick=()=>startFromEdit("ai");
reset();
</script>
